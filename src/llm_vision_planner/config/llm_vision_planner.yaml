interactive_mission_gateway:
  ros__parameters:
    environment: real
    intent_provider: openai
    openai_intent_model: gpt-5.4-nano
    planner_llm_provider: llama
    planner_model_name: rrt_planner
    visualizer: contraction
    operator_command_topic: /llm_vision/operator_command
    approval_topic: /llm_vision/mission_approval
    launch_approval_topic: /llm_vision/launch_approval
    operator_response_topic: /llm_vision/operator_response
    mission_proposal_topic: /llm_vision/mission_proposal
    launch_proposal_topic: /llm_vision/launch_proposal
    executor_command_topic: /llm_vision/executor_command
    safety_tube_ready_topic: /llm_vision/safety_tube_ready
    semantic_obstacle_topic: /llm_vision/semantic_obstacles
    sim_obstacle_topic: /llm_vision/sim_obstacles
    nominal_obstacle_topic: /llm_vision/nominal_obstacles
    mission_state_topic: /llm_vision/mission_state
    pose_topic: /fmu/out/vehicle_odometry
    prompt_topic: /llm_vision/prompt
    candidate_verification_topic: /llm_vision/plan_candidate_verified
    passed_plan_topic: /llm_vision/plan_verified
    required_mission_state: HOLDING_FOR_PLAN
    require_mission_state: True
    workspace_x_min: -3.0
    workspace_x_max: 3.0
    workspace_y_min: -3.0
    workspace_y_max: 3.0
    fixed_z: -0.5
    clearance_m: 0.40
    default_standoff_m: 0.60
    # Object-surface range grounding and bounded-workspace goal sampling.
    goal_sample_resolution_m: 0.10
    default_goal_range_half_width_m: 0.15
    exact_goal_distance_tolerance_m: 0.10
    fresh_data_timeout_s: 2.0
    approval_timeout_s: 30.0
    # Freeze the approved static snapshot; later perception changes do not cancel planning.
    freeze_scene_after_approval: True
    # Obstacle envelope per x-y side = position tolerance + 0.5 * size tolerance.
    scene_position_tolerance_m: 0.20
    scene_size_tolerance_m: 0.30
    obs_safety_bracket: conformal
    vision_error_calibration_csv: fine_tuning/datasets/calibration_vision_error_dummy.csv
    vision_error_delta: 0.10
    max_start_drift_m: 0.25
    # Keep margin below the executor's 0.10 m verified-plan start limit.
    max_release_start_drift_m: 0.08
    max_planning_attempts: 3
    debug: True

