semantic_obstacle_perception:
  ros__parameters:
    detection_topic: /tflite_data
    detector_image_topic: /tflite
    point_cloud_topic: /tof_pc
    pose_topic: /fmu/out/vehicle_odometry
    obstacle_topic: /llm_vision/semantic_obstacles
    goal_x: 2.5
    goal_y: 0.0
    goal_z: -0.5
    # Accepted hires_small_grey calibration for the paired 1024x768 IMX412
    # small stream (0.703523 px reprojection error, plumb_bob model).
    hires_fx: 501.5315609739347
    hires_fy: 502.8286520347511
    hires_cx: 508.1806484040712
    hires_cy: 380.6556051674785
    # Live VOXL check: hires_small_color is the paired 1024x768 TFLite input.
    hires_width: 1024
    hires_height: 768
    camera_calibration_valid: true
    detection_camera: hires_small_color
    detection_camera_aliases: [hires_small_color]
    # Starling 2 body FRD -> IMX412 optical frame, intrinsic XYZ degrees.
    detection_cam_body_x_m: 0.068
    detection_cam_body_y_m: 0.012
    detection_cam_body_z_m: -0.015
    detection_cam_roll_deg: 0.0
    detection_cam_pitch_deg: 90.0
    detection_cam_yaw_deg: 90.0
    # Values read from this vehicle's /etc/modalai/extrinsics.conf.
    depth_cam_body_x_m: 0.066
    depth_cam_body_y_m: 0.009
    depth_cam_body_z_m: -0.012
    depth_cam_roll_deg: 0.0
    depth_cam_pitch_deg: 90.0
    depth_cam_yaw_deg: 180.0
    # Raw /tof_pc is sensor-relative even when its bridge header says "world".
    point_cloud_frame: tof_optical
    min_confidence: 0.60
    detection_timeout_s: 1.0
    detector_timeout_s: 1.0
    point_cloud_timeout_s: 1.0
    pose_timeout_s: 1.0
    # Live source-stamp check observed 0.042-0.063 s RGB/ToF deltas at 10 Hz ToF.
    max_sync_slop_s: 0.35
    detection_to_depth_offset_s: 0.0
    z_estimation_mode: depth
    min_tof_depth_m: 0.20
    max_tof_depth_m: 6.0
    min_valid_point_cloud_points: 100
    min_frustum_points: 10
    # Prefer the box center so a foreground edge does not steal a rear object's range.
    bbox_inner_margin_fraction: 0.25
    depth_near_percentile: 25.0
    depth_cluster_tolerance_m: 0.35
    obstacle_hold_s: 3.0
    obstacle_match_distance_m: 0.75
    publish_hz: 2.0
    debug: False
    print_obstacles_period_s: 1.0

obstacle_perception:
  ros__parameters:
    point_cloud_topic: /voa_pc_out
    point_cloud_frame: auto
    pose_topic: /fmu/out/vehicle_odometry
    obstacle_topic: /llm_vision/obstacles
    goal_x: 2.5
    goal_y: 0.0
    goal_z: -0.5
    min_range_m: 0.20
    max_range_m: 4.5
    min_z_m: -2.0
    max_z_m: 1.0
    ego_exclusion_radius_m: 0.25
    dbscan_eps: 0.5
    dbscan_min_samples: 8
    debug: false

prompt_generator:
  ros__parameters:
    environment: real
    llm_provider: llama
    chatgpt_model_name: gpt-5.4-nano
    llama_model_name: rrt_planner
    single_shot: True
    initial_plan_id: 1
    workspace_x_min: 0.0
    workspace_x_max: 4.0
    workspace_y_min: 0.0
    workspace_y_max: 4.0
    fixed_z: -0.5
    goal_x: 2.5
    goal_y: 0.0
    goal_z: -0.5
    clearance_m: 0.40
    goal_clearance_m: 0.40
    semantic_obstacle_topic: /llm_vision/semantic_obstacles
    sim_obstacle_topic: /llm_vision/sim_obstacles
    prompt_topic: /llm_vision/prompt
    verified_plan_topic: /llm_vision/plan_verified
    mission_state_topic: /llm_vision/mission_state
    required_mission_state: HOLDING_FOR_PLAN
    require_mission_state: True
    snapshot_after_hover_s: 1.0
    prefer_nonempty_obstacle_snapshot: true
    nonempty_obstacle_wait_s: 3.0
    require_healthy_perception: true
    start_drift_replan_m: 0.25
    feedback_enabled: True
    pose_topic: /fmu/out/vehicle_odometry
    fresh_data_timeout_s: 2.0
    debug: True

interactive_mission_gateway:
  ros__parameters:
    environment: real
    intent_provider: openai
    openai_intent_model: gpt-5.4-nano
    planner_llm_provider: llama
    planner_model_name: rrt_planner
    operator_command_topic: /llm_vision/operator_command
    approval_topic: /llm_vision/mission_approval
    operator_response_topic: /llm_vision/operator_response
    mission_proposal_topic: /llm_vision/mission_proposal
    semantic_obstacle_topic: /llm_vision/semantic_obstacles
    sim_obstacle_topic: /llm_vision/sim_obstacles
    mission_state_topic: /llm_vision/mission_state
    pose_topic: /fmu/out/vehicle_odometry
    prompt_topic: /llm_vision/prompt
    candidate_verification_topic: /llm_vision/plan_candidate_verified
    passed_plan_topic: /llm_vision/plan_verified
    required_mission_state: HOLDING_FOR_PLAN
    require_mission_state: True
    workspace_x_min: 0.0
    workspace_x_max: 4.0
    workspace_y_min: 0.0
    workspace_y_max: 4.0
    fixed_z: -0.5
    clearance_m: 0.40
    default_standoff_m: 0.60
    fresh_data_timeout_s: 2.0
    approval_timeout_s: 30.0
    # Allow live TFLite/ToF box jitter while planning against an expanded envelope.
    scene_position_tolerance_m: 0.15
    scene_size_tolerance_m: 0.20
    max_start_drift_m: 0.25
    # Keep margin below the executor's 0.10 m verified-plan start limit.
    max_release_start_drift_m: 0.08
    max_planning_attempts: 3
    debug: True

interactive_web_ui:
