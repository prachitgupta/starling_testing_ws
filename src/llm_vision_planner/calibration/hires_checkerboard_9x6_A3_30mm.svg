<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="420mm" height="297mm" viewBox="0 0 420 297">
  <title>9x6 inner-corner checkerboard, 30 mm squares, A3 landscape</title>
  <desc>Print at 100 percent actual size. Pattern is 10x7 squares, giving 9x6 internal corners.</desc>
  <style>@page { size: A3 landscape; margin: 0; }</style>
  <defs>
    <pattern id="checker" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="30" height="30" fill="#000"/>
      <rect x="30" y="30" width="30" height="30" fill="#000"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="420" height="297" fill="#fff"/>
  <!-- 10 columns x 7 rows of 30 mm squares = 300 x 210 mm. -->
  <rect x="60" y="43.5" width="300" height="210" fill="url(#checker)"/>

  <!-- Print-scale check, deliberately outside the checkerboard's white border. -->
  <line x1="160" y1="274" x2="260" y2="274" stroke="#000" stroke-width="0.5"/>
  <line x1="160" y1="271" x2="160" y2="277" stroke="#000" stroke-width="0.5"/>
  <line x1="260" y1="271" x2="260" y2="277" stroke="#000" stroke-width="0.5"/>
  <text x="210" y="284" text-anchor="middle"
        font-family="sans-serif" font-size="4" fill="#000">
    Scale check: this line must measure exactly 100 mm
  </text>
</svg>
