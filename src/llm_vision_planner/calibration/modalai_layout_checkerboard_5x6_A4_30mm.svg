<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="210mm" height="297mm" viewBox="0 0 210 297">
  <title>ModalAI-layout 5x6 inner-corner checkerboard, 30 mm squares, A4</title>
  <desc>Print at 100 percent actual size. Pattern is 6x7 squares, giving 5x6 internal corners.</desc>
  <style>@page { size: A4 portrait; margin: 0; }</style>
  <defs>
    <pattern id="checker" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="30" height="30" fill="#000"/>
      <rect x="30" y="30" width="30" height="30" fill="#000"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="210" height="297" fill="#fff"/>
  <!-- 6 columns x 7 rows of 30 mm squares = 180 x 210 mm. -->
  <rect x="15" y="28" width="180" height="210" fill="url(#checker)"/>
  <line x1="55" y1="260" x2="155" y2="260" stroke="#000" stroke-width="0.4"/>
  <line x1="55" y1="257" x2="55" y2="263" stroke="#000" stroke-width="0.4"/>
  <line x1="155" y1="257" x2="155" y2="263" stroke="#000" stroke-width="0.4"/>
  <text x="105" y="271" text-anchor="middle"
        font-family="sans-serif" font-size="3.5" fill="#000">
    Scale check: this line must measure exactly 100 mm
  </text>
  <text x="105" y="280" text-anchor="middle"
        font-family="sans-serif" font-size="3.2" fill="#000">
    5x6 internal corners; 30 mm squares; print at 100% actual size
  </text>
</svg>
