verify_contraction:
  ros__parameters:
    environment: real
    refined_plan_topic: /llm_vision/plan_refined
    candidate_verification_topic: /llm_vision/plan_candidate_verified
    verified_plan_topic: /llm_vision/plan_verified
    safety_tube_ready_topic: /llm_vision/safety_tube_ready
    mission_proposal_topic: /llm_vision/mission_proposal
    semantic_obstacle_topic: /llm_vision/semantic_obstacles
    sim_obstacle_topic: /llm_vision/sim_obstacles
    pose_topic: /fmu/out/vehicle_odometry
    workspace_x_min: -3.0
    workspace_x_max: 3.0
    workspace_y_min: -3.0
    workspace_y_max: 3.0
    output_png: src/llm_vision_planner/plots/contraction/live_contraction.png
    show_window: true
    plot_period_s: 0.2
    pose_trail_limit: 1000
    trajectory_dt: 0.1
    max_horizontal_speed_mps: 0.5
    max_horizontal_acceleration_mps2: 0.5
    calibration_csv: fine_tuning/datasets/calibration_min_control_qp_position_score_with_limits_2000.csv
    calibration_samples: 2000
    # Blue tube radius q_p is the (1 - delta_p) quantile of calibrated position errors.
    delta_p: 0.10
    delta_w: 0.10
    drone_radius_m: 0.10
    # Exact segment/AABB checks need no extra sampling allowance for a piecewise-linear reference.
    discretization_allowance_m: 0.0
    debug: true

control_law_executer:
  ros__parameters:
    plan_topic: /llm_vision/plan_verified
    mission_state_topic: /llm_vision/mission_state
    pose_topic: /fmu/out/vehicle_odometry
    land_detected_topic: /fmu/out/vehicle_land_detected
    offboard_owner_topic: /llm_vision/offboard_owner
    executor_command_topic: /llm_vision/executor_command
    publish_hz: 20.0
    pose_timeout_s: 1.0
    prime_s: 1.5
    # Shared mission and vision-calibration Offboard hover altitude (NED z).
    takeoff_z: -0.5
    takeoff_accept_m: 0.15
    takeoff_settle_s: 1.0
    hover_speed_accept_mps: 0.20
    # Must be >= 1.1 * PX4 LNDMC_Z_VEL_MAX so vehicle_land_detected can trigger.
    land_descent_speed_mps: 0.30
    start_accept_m: 0.10
    goal_accept_m: 0.20
    goal_settle_s: 2.0
    # true lands after a successful mission; false holds the final goal in Offboard.
    land_after_complete: true
    command_retry_s: 1.0
    transition_timeout_s: 40.0
    trajectory_dt: 0.1
    # Hard horizontal bounds for the QP and outgoing Offboard velocity setpoints.
    max_horizontal_speed_mps: 0.5
    max_horizontal_acceleration_mps2: 0.5
    debug: true
